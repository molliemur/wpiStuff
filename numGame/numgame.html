    <main>
        <section class="card game-card">
            <h2>Numbers Game</h2>
            <p>Welcome to the Numbers Game</p>
            <p>Pick a number between 1-10,000 and keep guessing until you get it right </p>

            <div class="game-box">
            <label for="numField">Enter your guess</label>
            <input type="number" id="numField" min="1" max="100">
            <button id="guessButton" onclick="makeGuess()"> Submit guess</button>
            <button id="resetButton" onclick="loadGame()"> Reset Game</button>
            <p id="messageText">Enter a number and make your first guess</p>    
            <p id="guessCountText">Guess count: 0</p>
            </div>

        </section>
    </main>
