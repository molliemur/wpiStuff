<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Game</title>
    <link rel="stylesheet" href="../main/styles.css">
    <link rel="stylesheet" href="snake.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>

</head>
<body>
     <header>
        <h1>snake Game</h1>
        <p class="tagline">Use the arrow keys to control the snake and eat the food
        </p>
        </header>
        <nav>
            <a href="../main/html/index.html">Home</a>
            <a href="../main/html/aboutme.html">About Me</a>
            <a href="../main/html/mytown.html">My Town</a>
            <a href="../numGame/numgame.html">Number Game</a>
            <a href="../wordGame/wordGame.html">Word Game</a>
            <a href="../pong/pongGame.html"> Pong Game</a>
            <a href="snake.html">Snake</a>
        </nav>

        <main>
           <section class="snakeCard">
            <h1 id="snakeName">Snake Game</h1>
            <div class="heading"> 
                <span id="currentScore"> Score: 0</span>
                <button id="customBtn">Customize</button>
                <span id="highScore" >High Score: 0</span>
            </div>
            <div id="gameboard"></div>
           </section>
           <div class="modal" id="customize"> 
            <div class="modal-content" id="custom-content">
                <label for="food-color"> food color</label>
                <input id="food-color" type="color" value="#fdbcb4">

                <label for="snake-color"> snake color</label>
                <input id="snake-color" type="color" value="#dabc45">
                 <br>
                 <input id="slow" type="radio" name="speed" value="220">
                 <label for="slow">Slow</label>
                 <input id="med" type="radio" name="speed" value="120">
                 <label for="med">Medium</label>
                 <input id="fast" type="radio" name="speed" value="75">
                 <label for="fast">Fast</label>
                 <input id="vfast" type="radio" name="speed" value="50">
                 <label for="vfast">Turbo</label>
                 <br>
                <input id="small-board" type="radio" name="board-size" value=8>
                <label for="small-board"> small</label>
                <input id="med-board" type="radio" name="board-size" value=16>
                <label for="med-board"> medium</label>
                <input id="large-board" type="radio" name="board-size" value=32>
                <label for="large-board"> large</label>
                <input id="huge-board" type="radio" name="board-size" value=64>
                <label for="huge-board"> huge</label>
                 <br>
                <button id="customButton">submit </button>
            </div>
           </div>
           <div class="modal" id="gameOver">
            <div class="modal-content" id="gameOver-content">
                <h2> You lose</h2>
                <br>
                <button id="close">Close</button>
            </div>
           </div>
        </main>
         <footer>
    <p>Created by Mollie for Frontiers.</p>
            <h4>🖤🩶🤍💜</h4>
  </footer>
  <script src="jsFiles/snakeControls.js"></script>
  <script src="jsFiles/food.js" ></script>
  <script src="jsFiles/snake.js"></script>
  <script src="jsFiles/snakeGame.js"></script>
</body>
</html>
